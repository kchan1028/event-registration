# Render Blueprint for CycleReg (ADR 0004: Render web services and Render Postgres, Pro workspace).
#
# NOT APPLIED. Nothing here exists on Render. Email sign-in (ADR 0003, Phase 2) is built, but the
# other gates in docs/runbooks/deploy-render.md (cost approval, owner go-ahead, a Clerk instance
# per environment) still hold. Until MFA ships (Phase 3), hosted use is fictional data only.
# Steps, costs, and approvals: docs/runbooks/deploy-render.md.
#
# Production and staging are separate services with separate databases; staging never holds
# real rider data. No secrets are written here: DATABASE_URL comes from the database itself, and
# the Clerk keys (sync: false) are entered in the Render Dashboard when the Blueprint is created.
# VITE_CLERK_PUBLISHABLE_KEY must reach the Docker build as a build argument; confirm Render passes it.

services:
  - type: web
    name: cyclereg
    runtime: docker
    region: oregon
    plan: 0.5c-512mb # Starter
    numInstances: 2 # two instances during registration openings (ADR 0004)
    branch: main
    autoDeployTrigger: 'off' # production deploys are started by hand (operations.md change freeze)
    healthCheckPath: /api/health # 503 while the database is unreachable
    maxShutdownDelaySeconds: 30 # graceful shutdown on SIGTERM finishes requests in progress
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: HOLD_MINUTES
        value: '10'
      - key: DATABASE_URL
        fromDatabase:
          name: cyclereg-db
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES # the site's own origin, for example https://cyclereg.onrender.com
        sync: false

  - type: web
    name: cyclereg-staging
    runtime: docker
    region: oregon
    plan: 0.5c-512mb # Starter
    numInstances: 1
    branch: main
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: HOLD_MINUTES
        value: '10'
      - key: DATABASE_URL
        fromDatabase:
          name: cyclereg-staging-db
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false

databases:
  - name: cyclereg-db
    region: oregon
    plan: 0.5c-1g # Basic-1gb; point-in-time restore on the Pro workspace (7 days)
    postgresMajorVersion: '17' # same major version as CI and local setup
    databaseName: cyclereg
    user: cyclereg
    ipAllowList: [] # private network only: reachable from the services above, not the internet

  - name: cyclereg-staging-db
    region: oregon
    plan: 0.1c-256mb # Basic-256mb
    postgresMajorVersion: '17'
    databaseName: cyclereg_staging
    user: cyclereg_staging
    ipAllowList: []
