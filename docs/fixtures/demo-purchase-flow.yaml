# Demo purchase flow fixtures
#
# FAKE DATA ONLY. Every event, venue, rider, license number, price, and fee
# here is fictional and exists to drive the Phase 1 clickable demo described in
# product.md section 2a. None of it is a real event, a real price, or a
# statement of USA Cycling eligibility rules.
#
# Format is illustrative, not a schema. The real format is decided with the
# technology stack ADR. Money is integer cents with a currency code.

meta:
  fixture_set: demo-purchase-flow
  version: 1
  created: 2026-11-14
  currency: USD
  simulated: true

fees:
  # Applied once per order, after discounts. Both are demo values.
  platform_fee:
    label: "Demo platform fee"
    amount_cents: 300
    per: order
  processing_fee:
    label: "Demo processing fee (simulated)"
    rate_percent: 3
    base: entries_subtotal_after_discounts
    rounding: half_up_to_cent

events:
  - id: demo-valley-criterium
    name: "Demo Valley Criterium"
    venue: "Fictional Business Park, Demo City, CA"
    days:
      - id: dvc-sat
        date: 2027-04-17
        races:
          - id: dvc-men-4-5
            registration_category: "Men Cat 4/5"
            format: { type: timed, minutes: 35, plus_laps: 2 }
            start_time: "09:00"
            price_cents: 3500
            eligibility:
              all_of:
                - competition_class: { any_of: [men] }
                - license_category: { any_of: [4, 5] }
            capacity: { cap: 75, confirmed: 60 }
          - id: dvc-women-3-4-5
            registration_category: "Women Cat 3/4/5"
            format: { type: timed, minutes: 30, plus_laps: 2 }
            start_time: "09:50"
            price_cents: 3500
            eligibility:
              all_of:
                - competition_class: { any_of: [women] }
                - license_category: { any_of: [3, 4, 5] }
            capacity: { cap: 50, confirmed: 18 }
          - id: dvc-masters-35-3-4
            registration_category: "Masters 35+ Cat 3/4"
            format: { type: timed, minutes: 40, plus_laps: 3 }
            start_time: "10:40"
            price_cents: 4000
            eligibility:
              all_of:
                - racing_age: { min: 35 }
                - license_category: { any_of: [3, 4] }
            capacity: { cap: 60, confirmed: 60 }   # full: demo shows "Full"
          - id: dvc-juniors-10-14
            registration_category: "Juniors 10-14"
            format: { type: timed, minutes: 20, plus_laps: 1 }
            start_time: "11:40"
            price_cents: 1500
            eligibility:
              all_of:
                - racing_age: { min: 10, max: 14 }
            requires_guardian: true
            capacity: { cap: 40, confirmed: 6 }
          - id: dvc-open-4-5-evening
            registration_category: "Open Cat 4/5 Evening"
            format: { type: timed, minutes: 30, plus_laps: 2 }
            start_time: "17:30"
            price_cents: 3000
            eligibility:
              all_of:
                - license_category: { any_of: [4, 5] }
            capacity: { cap: 60, confirmed: 12 }
    discounts:
      - id: dvc-second-race
        label: "Second race discount"
        amount_cents: 1000
        applies: once_per_order_when_two_or_more_entries_on_same_day

  - id: demo-ridge-weekend
    name: "Demo Ridge Road Race Weekend"
    venue: "Imaginary Ridge Loop, Sampleton, CA"
    days:
      - id: drw-sat
        date: 2027-05-15
        races:
          - id: drw-rr-masters-35-3-4
            registration_category: "Masters 35+ Cat 3/4 Road Race"
            format: { type: distance, laps: 4, km: 64 }
            start_time: "08:30"
            price_cents: 5000
            eligibility:
              all_of:
                - racing_age: { min: 35 }
                - license_category: { any_of: [3, 4] }
            capacity: { cap: 80, confirmed: 41 }
          - id: drw-rr-4-5
            registration_category: "Cat 4/5 Road Race"
            format: { type: distance, laps: 3, km: 48 }
            start_time: "10:00"
            price_cents: 4500
            eligibility:
              all_of:
                - license_category: { any_of: [4, 5] }
            capacity: { cap: 80, confirmed: 55 }
      - id: drw-sun
        date: 2027-05-16
        races:
          - id: drw-crit-masters-35-3-4
            registration_category: "Masters 35+ Cat 3/4 Criterium"
            format: { type: timed, minutes: 40, plus_laps: 3 }
            start_time: "09:00"
            price_cents: 3500
            eligibility:
              all_of:
                - racing_age: { min: 35 }
                - license_category: { any_of: [3, 4] }
            capacity: { cap: 60, confirmed: 33 }
          - id: drw-crit-4-5
            registration_category: "Cat 4/5 Criterium"
            format: { type: timed, minutes: 35, plus_laps: 2 }
            start_time: "10:00"
            price_cents: 3500
            eligibility:
              all_of:
                - license_category: { any_of: [4, 5] }
            capacity: { cap: 60, confirmed: 47 }
    bundles:
      - id: drw-weekend
        label: "Weekend bundle (one road race + one criterium)"
        price_cents: 7500
        components:
          - { day: drw-sat, choose: one_eligible_race }
          - { day: drw-sun, choose: one_eligible_race }
        reserve: all_or_nothing

