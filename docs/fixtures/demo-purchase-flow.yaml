waiver:
  id: demo-sample-waiver
  version: "DEMO-WAIVER v1 (2026-11-14)"
  text_file: sample-waiver.md
  signature: { method: typed_name_plus_checkbox, guardian_required_for_minors: true }

validation_messages:
  # Shown next to the field and in the error summary at the top of the step.
  required:
    first_name: "Enter your first name."
    last_name: "Enter your last name."
    email: "Enter an email address, like name@example.com."
    date_of_birth: "Enter your date of birth to confirm your racing age."
    emergency_contact_name: "Enter an emergency contact's name."
    emergency_contact_phone: "Enter an emergency contact's phone number."
    guardian_name: "Riders under 18 need a parent or guardian. Enter their name."
    entry: "Choose at least one race to continue."
    waiver_read: "Read the waiver to the end before signing."
    waiver_signature: "Type your full name to sign the waiver."
    waiver_agree: "Check the box to confirm you agree to the waiver."
  format:
    email: "This email address is missing an @ or a domain. Check it and try again."
    phone: "Enter a phone number with 10 digits."
    signature_mismatch: "The typed name must match the rider's name (or the guardian's, for a minor)."
  availability:
    full: "This category is full. Choose another category or ask the organizer about the waitlist."
    ineligible: "This category does not match the rider's age or license category."
