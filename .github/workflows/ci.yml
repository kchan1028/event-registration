name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Both jobs use a throwaway PostgreSQL service (ADR 0004). The credentials are test-only values for that container.
env:
  TEST_DATABASE_URL: postgres://cyclereg:cyclereg@127.0.0.1:5432/cyclereg
  E2E_DATABASE_URL: postgres://cyclereg:cyclereg@127.0.0.1:5432/cyclereg_e2e

jobs:
  check:
    name: Typecheck, unit and API tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cyclereg
          POSTGRES_PASSWORD: cyclereg
          POSTGRES_DB: cyclereg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyclereg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end browser test
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cyclereg
          POSTGRES_PASSWORD: cyclereg
          POSTGRES_DB: cyclereg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyclereg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
