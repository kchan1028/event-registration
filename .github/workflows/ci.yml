name: CI

# CI starts for every change, so the required checks always report. For documentation-only
# changes the test jobs are skipped (GitHub counts a skipped required check as passed).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request cancels the older run. Runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Both test jobs use a throwaway PostgreSQL service (ADR 0004). The credentials are test-only values for that container.
env:
  TEST_DATABASE_URL: postgres://cyclereg:cyclereg@127.0.0.1:5432/cyclereg
  E2E_DATABASE_URL: postgres://cyclereg:cyclereg@127.0.0.1:5432/cyclereg_e2e

jobs:
  changes:
    name: Detect documentation-only changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Markdown files and docs/ are documentation; docs/fixtures is not, because tests read it.
      # Anything unexpected (an unreadable diff, an empty one) counts as a code change. --no-renames lists a
      # renamed file under both its old and new path, so moving code into docs/ still counts as code.
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if files=$(git diff --name-only --no-renames "$BASE"...HEAD 2>/dev/null) && [ -n "$files" ]; then
            code=false
            while IFS= read -r f; do
              case "$f" in
                docs/fixtures/*) code=true ;;
                *.md|docs/*) ;;
                *) code=true ;;
              esac
            done <<< "$files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # Every change, including documentation-only ones: relative links and heading anchors in tracked Markdown.
  # Needs no install; the script uses only Node and git.
  docs:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check:docs

  check:
    name: Typecheck, unit and API tests, build
    needs: changes
    # Run unless detection succeeded and found documentation only, so a failed detection job runs the tests.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cyclereg
          POSTGRES_PASSWORD: cyclereg
          POSTGRES_DB: cyclereg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyclereg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Runs alongside `check` instead of after it.
  e2e:
    name: End-to-end browser test
    needs: changes
    # Run unless detection succeeded and found documentation only, so a failed detection job runs the tests.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cyclereg
          POSTGRES_PASSWORD: cyclereg
          POSTGRES_DB: cyclereg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyclereg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
