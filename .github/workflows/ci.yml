name: CI

# Documentation-only changes skip CI. docs/fixtures stays in because tests read it.
on:
  push:
    branches: [main]
    paths: ['**', '!**/*.md', '!docs/**', 'docs/fixtures/**']
  pull_request:
    paths: ['**', '!**/*.md', '!docs/**', 'docs/fixtures/**']

permissions:
  contents: read

# A newer push to the same pull request cancels the older run. Runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Both test jobs use a throwaway PostgreSQL service (ADR 0004). The credentials are test-only values for that container.
env:
  TEST_DATABASE_URL: postgres://cyclereg:cyclereg@127.0.0.1:5432/cyclereg
  E2E_DATABASE_URL: postgres://cyclereg:cyclereg@127.0.0.1:5432/cyclereg_e2e

jobs:
  check:
    name: Typecheck, unit and API tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cyclereg
          POSTGRES_PASSWORD: cyclereg
          POSTGRES_DB: cyclereg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyclereg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Runs alongside `check` instead of after it.
  e2e:
    name: End-to-end browser test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cyclereg
          POSTGRES_PASSWORD: cyclereg
          POSTGRES_DB: cyclereg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyclereg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
