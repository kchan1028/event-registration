name: Delete branch of closed pull request

# Merged pull requests already lose their branch through the repository setting
# "Automatically delete head branches". This covers pull requests closed without merging.
# Forks are left alone, and main is never deleted (the ruleset also blocks that).
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete:
    name: Delete closed branch
    if: >-
      !github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      # Only a branch that is already gone (GitHub answers "Reference does not exist") counts as done;
      # any other failure fails the job so it shows up and can be rerun.
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        # Each path segment is URL-encoded, so names like fix/issue#123 or fix/100% reach the right ref.
        run: |
          ref=$(jq -rn --arg b "$BRANCH" '$b | split("/") | map(@uri) | join("/")')
          if out=$(gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$ref" 2>&1); then
            echo "Deleted $BRANCH."
          elif grep -q "Reference does not exist" <<< "$out"; then
            echo "Branch $BRANCH was already deleted."
          else
            echo "$out" >&2
            exit 1
          fi
