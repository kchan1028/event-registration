name: Delete branch of closed pull request

# Merged pull requests already lose their branch through the repository setting
# "Automatically delete head branches". This covers pull requests closed without merging.
# Forks are left alone, and main is never deleted (the ruleset also blocks that).
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete:
    name: Delete closed branch
    if: >-
      !github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      # A branch that is already gone (deleted by hand) is not an error.
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$BRANCH" || echo "Branch $BRANCH was already deleted."
